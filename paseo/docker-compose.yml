services:
  paseo:
    build: .
    image: paseo-with-agents
    container_name: paseo
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      PASEO_PASSWORD: "change-me"
      PASEO_HOSTNAMES: "paseo.example.com,.lan"
      GIT_CONFIG_GLOBAL: /home/paseo/.gitconfig
    volumes:
      - ./paseo-home:/home/paseo
      - ./workspace:/workspace
    networks:
      - paseo-network

networks:
  paseo-network:
    driver: bridge
