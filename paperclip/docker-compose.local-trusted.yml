services:
  paperclip:
    environment:
      HOST: 127.0.0.1
      PAPERCLIP_BIND: loopback
      PAPERCLIP_DEPLOYMENT_MODE: local_trusted
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
    ports:
      - "127.0.0.1:3100:3101"

  loopback-bridge:
    image: alpine/socat:1.8.1.3
    container_name: paperclip-loopback-bridge
    restart: unless-stopped
    network_mode: "service:paperclip"
    entrypoint: ["/usr/bin/socat"]
    command: ["TCP-LISTEN:3101,fork,reuseaddr", "TCP:127.0.0.1:3100"]
    depends_on:
      - paperclip
