services:
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nginx_network
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPU_LIMIT:-0.5}
    pids_limit: ${NGINX_PIDS_LIMIT:-100}

networks:
  nginx_network:
    driver: bridge

volumes:
  letsencrypt:
