name: Security

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1af67 # v4.2.2

      - name: Create placeholder env and secrets
        run: |
          cp postgres/.env.example postgres/.env
          cp cronicle/env.example cronicle/.env
          cp nginx/.env.example nginx/.env
          mkdir -p postgres/secrets
          printf 'database:5432:micasa-prod:backup:placeholder\n' > postgres/secrets/pgpass
          printf '[default]\naws_access_key_id = PLACEHOLDER\naws_secret_access_key = PLACEHOLDER\n' > postgres/secrets/aws_credentials
          chmod 600 postgres/secrets/*

      - name: Validate Compose files
        run: |
          docker compose -f postgres/docker-compose.yml config -q
          docker compose -f cronicle/docker-compose.yml config -q
          docker compose -f nginx/docker-compose.yml config -q
          docker compose -f minecraft-server/docker-compose.yml config -q

      - name: Run repository validation script
        run: ./scripts/validate-security.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b09d3a92473d7acc50a6afd7b9f17e3eea8c2e # 2.0.0
        with:
          scandir: .
          severity: warning

      - name: Hadolint
        uses: hadolint/hadolint-action@f27b70e8f5d0b0e4b24b7889f17fdfc01248e4c # v3.1.0
        with:
          dockerfile: postgres/backup.Dockerfile
      - uses: hadolint/hadolint-action@f27b70e8f5d0b0e4b24b7889f17fdfc01248e4c # v3.1.0
        with:
          dockerfile: cronicle/Dockerfile
      - uses: hadolint/hadolint-action@f27b70e8f5d0b0e4b24b7889f17fdfc01248e4c # v3.1.0
        with:
          dockerfile: nginx/nginx.Dockerfile

  build-images:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1af67 # v4.2.2

      - name: Create placeholder secrets for compose config
        run: |
          mkdir -p postgres/secrets
          printf 'database:5432:micasa-prod:backup:placeholder\n' > postgres/secrets/pgpass
          printf '[default]\naws_access_key_id = PLACEHOLDER\naws_secret_access_key = PLACEHOLDER\n' > postgres/secrets/aws_credentials
          chmod 600 postgres/secrets/*

      - name: Build backup image
        run: docker build -f postgres/backup.Dockerfile -t vps-compose-backup:ci postgres

      - name: Build cronicle image
        run: docker build -f cronicle/Dockerfile -t vps-compose-cronicle:ci cronicle

      - name: Build nginx image
        run: docker build -f nginx/nginx.Dockerfile -t vps-compose-nginx:ci nginx

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1af67 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@a6ccf6720986f9c8da5f1bbb812d6aa3b8597551 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1af67 # v4.2.2

      - name: Create placeholder secrets
        run: |
          mkdir -p postgres/secrets
          printf 'database:5432:micasa-prod:backup:placeholder\n' > postgres/secrets/pgpass
          printf '[default]\naws_access_key_id = PLACEHOLDER\naws_secret_access_key = PLACEHOLDER\n' > postgres/secrets/aws_credentials
          chmod 600 postgres/secrets/*

      - name: Build images for scanning
        run: |
          docker build -f postgres/backup.Dockerfile -t vps-compose-backup:ci postgres
          docker build -f cronicle/Dockerfile -t vps-compose-cronicle:ci cronicle

      - name: Trivy scan backup image
        uses: aquasecurity/trivy-action@6af7d2fcf3b1c7a1fd3c25a1d5e88b8af2b524d # 0.30.0
        with:
          image-ref: vps-compose-backup:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan cronicle image
        uses: aquasecurity/trivy-action@6af7d2fcf3b1c7a1fd3c25a1d5e88b8af2b524d # 0.30.0
        with:
          image-ref: vps-compose-cronicle:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
