services:
  database:
    image: postgres:15.18-alpine3.21
    container_name: postgres_db
    init: true
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "0.0.0.0:5432:5432"
    networks:
      - db_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    tmpfs:
      - /tmp:rw,noexec,nosuid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-200}

  postgres_backup_to_s3:
    build:
      context: .
      dockerfile: backup.Dockerfile
    container_name: postgres_backup
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
    volumes:
      - ./logrotate.conf:/etc/logrotate.d/backup:ro
      - ./backups:/backups
    secrets:
      - pgpass
      - aws_credentials
    networks:
      - db_internal
      - backup_egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${BACKUP_MEMORY_LIMIT:-256m}
    cpus: ${BACKUP_CPU_LIMIT:-0.5}
    pids_limit: ${BACKUP_PIDS_LIMIT:-100}

networks:
  db_internal:
    internal: true
  backup_egress:
    driver: bridge

volumes:
  postgres_data:

secrets:
  pgpass:
    file: ${PGPASS_SECRET_FILE:-./secrets/pgpass}
  aws_credentials:
    file: ${AWS_CREDENTIALS_SECRET_FILE:-./secrets/aws_credentials}
