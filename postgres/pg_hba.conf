# PostgreSQL host-based authentication
# Mounted at /etc/postgresql/pg_hba.conf and referenced via postgres -c hba_file=...
# Rule order matters: PostgreSQL uses the first matching rule.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket connections (container admin via docker exec)
local   all             all                                     scram-sha-256

# Loopback TCP inside the container
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Public application access (Vercel): vercel role on micasa-prod only
host    micasa-prod     vercel          0.0.0.0/0               scram-sha-256

# Docker internal networks (backup service, host via docker bridge gateway)
# Covers default Docker bridge ranges (172.16.0.0/12) and common compose subnets.
host    all             all             172.16.0.0/12           scram-sha-256

# All other remote connections are rejected (no matching rule).
